# System packages (.deb, .rpm, .apk, Arch) for GearHead: Arena, built by
# nfpm from the same static Linux build as the av archive. The release
# workflow sets VERSION, RELEASE (our packaging release) and ARCH (amd64
# or arm64).
#
# The av layout is installed whole in /usr/lib/gharena (start script,
# lib/), with /usr/bin/gharena a link to the start script, which follows
# it. No .desktop file on purpose: av is the one place titles are started
# from.
name: gearhead-arena
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: ${RELEASE}
section: games
priority: optional
maintainer: Asciiverse <packages@asciiverse.sh>
vendor: Asciiverse
homepage: https://github.com/theasciiverse/gearhead-arena
license: LGPL-3.0-or-later
description: |
  The first roguelike mecha RPG, in the terminal.
  Pilot giant robots, fight in arenas and wander a world of randomly
  generated adventures in the GearHead universe.
  GearHead: Arena by Joseph Hewitt, ASCII version, packaged by Asciiverse.
contents:
  - src: stage/gharena
    dst: /usr/lib/gharena/gharena
    file_info: { mode: 0755 }
  - src: stage/lib/
    dst: /usr/lib/gharena/lib/
  - src: /usr/lib/gharena/gharena
    dst: /usr/bin/gharena
    type: symlink
  - src: license.txt
    dst: /usr/share/doc/gearhead-arena/copyright
    file_info: { mode: 0644 }
  - src: PATCHES.md
    dst: /usr/share/doc/gearhead-arena/PATCHES.md
    file_info: { mode: 0644 }
